<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arica Chile Roleplay - Portal</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #0f1115;
            --card-bg: #181c24;
            --text: #ffffff;
            --text-muted: #949ba4;
            --success: #40d98a;
            --danger: #ff4d5f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            position: relative;
            box-sizing: border-box;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-top h3 {
            margin: 0;
        }

        .close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .close:hover {
            color: var(--text);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f1115;
            border: 1px solid #2b2d31;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .modal-button {
            background-color: var(--success);
            color: #0f1115;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .modal-button:hover {
            opacity: 0.9;
        }

        .modal-note {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Arica Chile Roleplay</h1>
        <p>Portal oficial de registro ciudadano y gestión de documentos.</p>
        <button class="btn" onclick="openModal()">Crear / Registrar DNI</button>
    </div>

    <!-- MODAL DE REGISTRO -->
    <div class="modal" id="appModal">
        <div class="modal-box">
            <div class="modal-top">
                <h3 id="modalTitle">Registro de DNI</h3>
                <button class="close" onclick="closeModal()">✕</button>
            </div>
            <div class="input-group">
                <label>Nombre del Ciudadano</label>
                <input type="text" id="inputNombre" placeholder="Ej: Juan Pérez">
            </div>
            <div class="input-group">
                <label>Discord ID / Usuario</label>
                <input type="text" id="inputDiscord" placeholder="Ej: user#1234">
            </div>
            <div class="input-group">
                <label>Número de DNI</label>
                <input type="text" id="inputDni" placeholder="Ej: 18.234.567-K">
            </div>
            <button class="modal-button" onclick="guardarDniEnFirebase()">Guardar en Base de Datos</button>
            <div class="modal-note" id="estadoRegistro">Completa tus datos para registrarte oficialmente.</div>
        </div>
    </div>

    <!-- SCRIPTS DE LA INTERFAZ Y FIREBASE -->
    <script>
        function openModal() {
            document.getElementById('appModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('appModal').style.display = 'none';
        }
    </script>

    <!-- SDK de Firebase con tus credenciales integradas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Tus credenciales oficiales de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBw2s2yliDuMxBV8jIijl0tJkGSKqaQJqg",
            authDomain: "arica-web-portal.firebaseapp.com",
            databaseURL: "https://arica-web-portal-default-rtdb.firebaseio.com",
            projectId: "arica-web-portal",
            storageBucket: "arica-web-portal.firebasestorage.app",
            messagingSenderId: "180673537657",
            appId: "1:180673537657:web:70ce6ea78cc06fb7fc16a8",
            measurementId: "G-5V0QD0RY25"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para enviar los datos a Firestore
        window.guardarDniEnFirebase = async function() {
            const nombre = document.getElementById('inputNombre').value;
            const discord = document.getElementById('inputDiscord').value;
            const dni = document.getElementById('inputDni').value;
            const estado = document.getElementById('estadoRegistro');

            if (!nombre || !discord || !dni) {
                estado.innerText = "⚠️ Por favor, completa todos los campos.";
                estado.style.color = "#ff4d5f";
                return;
            }

            try {
                estado.innerText = "Guardando en la base de datos...";
                
                await addDoc(collection(db, "ciudadanos"), {
                    nombre: nombre,
                    discord: discord,
                    dni: dni,
                    fecha: new Date().toISOString()
                });

                estado.innerText = "✅ ¡DNI creado y guardado con éxito!";
                estado.style.color = "#40d98a";
                
                setTimeout(() => {
                    closeModal();
                    document.getElementById('inputNombre').value = '';
                    document.getElementById('inputDiscord').value = '';
                    document.getElementById('inputDni').value = '';
                    estado.innerText = "Completa tus datos para registrarte oficialmente.";
                    estado.style.color = "#949ba4";
                }, 2000);

            } catch (error) {
                console.error("Error al guardar: ", error);
                estado.innerText = "❌ Error al conectar con la base de datos.";
                estado.style.color = "#ff4d5f";
            }
        };
    </script>
</body>
</html>
