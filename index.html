<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arica Chile Roleplay - Portal de Acceso</title>
    <style>
        :root {
            --primary: #5865F2;
            --bg: #0f1115;
            --card-bg: #181c24;
            --text: #ffffff;
            --text-muted: #949ba4;
            --success: #40d98a;
            --danger: #ff4d5f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 22px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f1115;
            border: 1px solid #2b2d31;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .links a {
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
        }

        .links a:hover {
            color: var(--text);
            text-decoration: underline;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: left;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            position: relative;
            box-sizing: border-box;
        }

        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-top h3 {
            margin: 0;
        }

        .close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .close:hover {
            color: var(--text);
        }

        .modal-button {
            background-color: var(--success);
            color: #0f1115;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .modal-note {
            margin-top: 15px;
            font-size: 12px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- PANEL DE INICIO DE SESIÓN ORIGINAL -->
    <div class="container">
        <h1>Arica Chile Roleplay</h1>
        <p>Inicia sesión con tu perfil de Discord para acceder</p>
        
        <div class="input-group">
            <label>Perfil de Discord / Usuario</label>
            <input type="text" id="loginDiscord" placeholder="Ej: user#1234">
        </div>
        <div class="input-group">
            <label>Contraseña o PIN</label>
            <input type="password" id="loginPass" placeholder="••••••••">
        </div>
        
        <button class="btn" onclick="intentarLogin()">Iniciar Sesión</button>
        
        <div class="links">
            <a onclick="openRecuperar()">¿Olvidaste tu contraseña?</a>
            <a onclick="openRegistro()">Crear DNI / Registrarse</a>
        </div>
    </div>

    <!-- MODAL DE REGISTRO / CREAR DNI -->
    <div class="modal" id="modalRegistro">
        <div class="modal-box">
            <div class="modal-top">
                <h3>Registro de DNI</h3>
                <button class="close" onclick="closeModales()">✕</button>
            </div>
            <div class="input-group">
                <label>Nombre del Ciudadano</label>
                <input type="text" id="regNombre" placeholder="Ej: Juan Pérez">
            </div>
            <div class="input-group">
                <label>Discord ID / Usuario</label>
                <input type="text" id="regDiscord" placeholder="Ej: user#1234">
            </div>
            <div class="input-group">
                <label>Número de DNI</label>
                <input type="text" id="regDni" placeholder="Ej: 18.234.567-K">
            </div>
            <div class="input-group">
                <label>Contraseña de acceso</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <button class="modal-button" onclick="guardarDniEnFirebase()">Registrar / Crear DNI</button>
            <div class="modal-note" id="estadoRegistro">Completa los datos para guardar en la base de datos.</div>
        </div>
    </div>

    <!-- MODAL DE RECUPERAR CONTRASEÑA -->
    <div class="modal" id="modalRecuperar">
        <div class="modal-box">
            <div class="modal-top">
                <h3>Recuperar Acceso</h3>
                <button class="close" onclick="closeModales()">✕</button>
            </div>
            <div class="input-group">
                <label>Tu Discord ID</label>
                <input type="text" id="recDiscord" placeholder="Ej: user#1234">
            </div>
            <button class="modal-button" style="background-color: var(--primary); color: white;" onclick="enviarRecuperacion()">Enviar Solicitud</button>
            <div class="modal-note" id="estadoRecuperar">Ingresa tu usuario para verificar tu DNI.</div>
        </div>
    </div>

    <!-- SCRIPTS DE CONTROL DE INTERFAZ Y FIREBASE -->
    <script>
        function closeModales() {
            document.getElementById('modalRegistro').style.display = 'none';
            document.getElementById('modalRecuperar').style.display = 'none';
        }

        function openRegistro() {
            closeModales();
            document.getElementById('modalRegistro').style.display = 'flex';
        }

        function openRecuperar() {
            closeModales();
            document.getElementById('modalRecuperar').style.display = 'flex';
        }

        function intentarLogin() {
            const discord = document.getElementById('loginDiscord').value;
            const pass = document.getElementById('loginPass').value;
            if(!discord || !pass) {
                alert("Por favor completa tu usuario y contraseña.");
                return;
            }
            alert("⚠️ Sesión simulada: Funcionalidad de login lista. (Para entrar al registro usa el botón de abajo)");
        }

        function enviarRecuperacion() {
            const rec = document.getElementById('recDiscord').value;
            if(!rec) {
                alert("Ingresa tu Discord ID.");
                return;
            }
            document.getElementById('estadoRecuperar').innerText = "✅ Solicitud enviada al sistema.";
        }
    </script>

    <!-- SDK de Firebase con tus credenciales integradas -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBw2s2yliDuMxBV8jIijl0tJkGSKqaQJqg",
            authDomain: "arica-web-portal.firebaseapp.com",
            databaseURL: "https://arica-web-portal-default-rtdb.firebaseio.com",
            projectId: "arica-web-portal",
            storageBucket: "arica-web-portal.firebasestorage.app",
            messagingSenderId: "180673537657",
            appId: "1:180673537657:web:70ce6ea78cc06fb7fc16a8",
            measurementId: "G-5V0QD0RY25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.guardarDniEnFirebase = async function() {
            const nombre = document.getElementById('regNombre').value;
            const discord = document.getElementById('regDiscord').value;
            const dni = document.getElementById('regDni').value;
            const pass = document.getElementById('regPass').value;
            const estado = document.getElementById('estadoRegistro');

            if (!nombre || !discord || !dni || !pass) {
                estado.innerText = "⚠️ Por favor, completa todos los campos.";
                estado.style.color = "#ff4d5f";
                return;
            }

            try {
                estado.innerText = "Guardando en la base de datos...";
                
                await addDoc(collection(db, "ciudadanos"), {
                    nombre: nombre,
                    discord: discord,
                    dni: dni,
                    password: pass,
                    fecha: new Date().toISOString()
                });

                estado.innerText = "✅ ¡DNI creado y guardado con éxito!";
                estado.style.color = "#40d98a";
                
                setTimeout(() => {
                    closeModales();
                    document.getElementById('regNombre').value = '';
                    document.getElementById('regDiscord').value = '';
                    document.getElementById('regDni').value = '';
                    document.getElementById('regPass').value = '';
                    estado.innerText = "Completa los datos para guardar en la base de datos.";
                    estado.style.color = "#949ba4";
                }, 2000);

            } catch (error) {
                console.error("Error al guardar: ", error);
                estado.innerText = "❌ Error al conectar con la base de datos.";
                estado.style.color = "#ff4d5f";
            }
        };
    </script>
</body>
</html>
